name: Build BB10 Hub (Lawnchair 12-dev)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout BB10 Hub repo
        uses: actions/checkout@v4
        with:
          path: bb10-source
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      
      - name: Clone Lawnchair 12-dev
        run: |
          git clone --branch 12-dev --recurse-submodules \
            https://github.com/LawnchairLauncher/lawnchair.git launcher
          cd launcher
          git submodule update --init --recursive
      
      - name: Copy BB10 Hub source files
        run: |
          mkdir -p launcher/lawnchair/src/app/lawnchair/bb10hub
          cp bb10-source/lawnchair/src/app/lawnchair/bb10hub/*.kt \
             launcher/lawnchair/src/app/lawnchair/bb10hub/ 2>/dev/null || true
          
          mkdir -p launcher/lawnchair/src/main/res/values
          mkdir -p launcher/lawnchair/src/main/res/xml
          mkdir -p launcher/lawnchair/src/main/res/layout
          
          cp bb10-source/lawnchair/src/main/res/values/*.xml \
             launcher/lawnchair/src/main/res/values/ 2>/dev/null || true
          cp bb10-source/lawnchair/src/main/res/xml/*.xml \
             launcher/lawnchair/src/main/res/xml/ 2>/dev/null || true
          cp bb10-source/lawnchair/src/main/res/layout/*.xml \
             launcher/lawnchair/src/main/res/layout/ 2>/dev/null || true
      
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Make gradlew executable
        run: |
          cd launcher
          chmod +x gradlew
      
      - name: Build debug APK
        run: |
          cd launcher
          ./gradlew assembleLawnWithQuickstepDebug --stacktrace 2>&1 | tee build.log
        continue-on-error: true
      
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: launcher/build.log
          if-no-files-found: ignore
        
      - name: Find and collect APKs
        run: |
          echo "=== Looking for APK files ==="
          mkdir -p artifacts
          find launcher -name "*.apk" -type f -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -la artifacts/ || echo "No APKs found"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bb10-hub-debug
          path: artifacts/*.apk
          retention-days: 90
          if-no-files-found: warn
