name: Build BB10 Hub (AOSP Launcher)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout BB10 Hub repo
        uses: actions/checkout@v4
        with:
          path: bb10-source
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
      
      - name: Clone Lawnchair 12-dev
        run: |
          git clone --branch 12-dev --recurse-submodules \
            https://github.com/LawnchairLauncher/lawnchair.git launcher
          cd launcher
          git submodule update --init --recursive
      
      - name: Copy BB10 Hub source files
        run: |
          mkdir -p launcher/src/com/android/launcher3/bb10hub
          cp bb10-source/lawnchair/src/app/lawnchair/bb10hub/*.kt \
             launcher/src/com/android/launcher3/bb10hub/ 2>/dev/null || echo "Copying Kotlin files..."
          
          mkdir -p launcher/res/values
          mkdir -p launcher/res/xml
          mkdir -p launcher/res/layout
          
          cp bb10-source/lawnchair/src/main/res/values/*.xml \
             launcher/res/values/ 2>/dev/null || true
          cp bb10-source/lawnchair/src/main/res/xml/*.xml \
             launcher/res/xml/ 2>/dev/null || true
          cp bb10-source/lawnchair/src/main/res/layout/*.xml \
             launcher/res/layout/ 2>/dev/null || true
      
      - name: Apply AndroidManifest.xml patch
        run: |
          cd launcher
          if ! grep -q "HubNotificationService" AndroidManifest.xml; then
            sed -i '/<\/application>/i\
            <!-- BB10 Hub Notification Listener -->\
            <service\
                android:name="com.android.launcher3.bb10hub.HubNotificationService"\
                android:exported="true"\
                android:label="BB10 Hub"\
                android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">\
                <intent-filter>\
                    <action android:name="android.service.notification.NotificationListenerService" />\
                </intent-filter>\
            </service>\
            <!-- BB10 Hub Activity -->\
            <activity\
                android:name="com.android.launcher3.bb10hub.Bb10HubActivity"\
                android:exported="false"\
                android:launchMode="singleTop" />\
            <!-- BB10 Hub Settings Activity -->\
            <activity\
                android:name="com.android.launcher3.bb10hub.Bb10SettingsActivity"\
                android:exported="false" />' \
